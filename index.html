        const container = document.getElementById('questionsContainer');
        const searchInput = document.getElementById('searchInput');
        const resultsCount = document.getElementById('resultsCount');
        const noResults = document.getElementById('noResults');

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function renderQuestions(filteredQuestions) {
            container.innerHTML = '';

            if (filteredQuestions.length === 0) {
                noResults.classList.remove('hidden');
                resultsCount.textContent = 'Ничего не найдено';
                return;
            }

            noResults.classList.add('hidden');
            resultsCount.textContent = `Найдено вопросов: ${filteredQuestions.length} из 35`;

            filteredQuestions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';

                const query = searchInput.value.trim();
                const highlightedTitle = highlightText(q.title, query);
                const highlightedAnswer = highlightText(q.answer, query);

                card.innerHTML = `
                    <div class="question-number">Вопрос ${q.number}</div>
                    <div class="question-title">${highlightedTitle}</div>
                    <div class="answer">${highlightedAnswer}</div>
                `;

                container.appendChild(card);
            });
        }

        function filterQuestions() {
            const query = searchInput.value.toLowerCase().trim();

            if (!query) {
                renderQuestions(questions);
                return;
            }

            const filtered = questions.filter(q =>
                q.title.toLowerCase().includes(query) ||
                q.answer.toLowerCase().includes(query)
            );

            renderQuestions(filtered);
        }

        searchInput.addEventListener('input', filterQuestions);

        renderQuestions(questions);
    </script>
</body>
